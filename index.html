<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Duygu Avı</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      height: 100%;
      font-family: 'Nunito', system-ui, sans-serif;
      background: #FAF7F2;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    #root {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes card-in {
      0%   { opacity: 0; transform: translateY(24px) scale(0.94); }
      60%  { transform: translateY(-4px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shake-wiggle {
      0%, 100% { transform: rotate(0deg); }
      20%      { transform: rotate(-12deg); }
      40%      { transform: rotate(10deg); }
      60%      { transform: rotate(-8deg); }
      80%      { transform: rotate(6deg); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(0.55); opacity: 0.45; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    @keyframes float-y {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-18px) scale(1.1); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: translateY(14px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes count-ring {
      0%   { transform: scale(0.55); opacity: 0.55; }
      100% { transform: scale(2);    opacity: 0; }
    }
    @keyframes count-pump {
      0%   { transform: scale(0.5); opacity: 0; }
      35%  { transform: scale(1.15); opacity: 1; }
      55%  { transform: scale(0.95); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes twist {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(78deg); }
      50%      { transform: rotate(0deg); }
      75%      { transform: rotate(-78deg); }
    }
    .enter    { animation: enter 0.4s cubic-bezier(0.2,0.8,0.2,1) both; }
    .card-in  { animation: card-in 0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
